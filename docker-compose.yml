services:

  db:
    container_name: db
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "13306:3306"
    volumes:
      - ./docker/mysql:/var/lib/mysql
    networks:
      - symfony-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management interface port
    volumes:
      - ./docker/rabbitmq:/var/lib/rabbitmq:rw
    networks:
      - symfony-network
    user: "999:999"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    container_name: redis
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis:/data
    networks:
      - symfony-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: redis-server --requirepass ${REDIS_PASSWORD}

  php-fpm:
    env_file:
      - symfony/.env
    container_name: php-fpm
    build:
      context: ./docker/php-fpm
      args:
        BUILD_ENVIRONMENT: ${BUILD_ENVIRONMENT}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE}?serverVersion=8.0"
      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f/messages"
      MESSENGER_TRANSPORT_DSN_TEST: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f/test_messages"
      REDIS_DSN: "redis://${REDIS_USER}:${REDIS_PASSWORD}@redis:6379"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_USER: "${REDIS_USER}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "${REDIS_PORT}"
    volumes:
      - ./symfony/:/var/www
    networks:
      - symfony-network

  nginx:
    env_file:
      - symfony/.env
    container_name: nginx
    build:
      context: ./docker/nginx
    volumes:
      - ./symfony/:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites/:/etc/nginx/sites-available
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d
      - ./logs/nginx:/var/log/nginx
    ports:
      - "85:80"
      - "446:443"
    depends_on:
      - php-fpm
    networks:
      - symfony-network

  # we should restart it after every php code change.
  supervisor:
    container_name: supervisor
    build:
      context: ./docker/supervisor
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE}"
      MESSENGER_TRANSPORT_DSN: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f/messages"
      MESSENGER_TRANSPORT_DSN_TEST: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f/test_messages"
      REDIS_DSN: "redis://${REDIS_USER}:${REDIS_PASSWORD}@redis:6379"
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_USER: "${REDIS_USER}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "${REDIS_PORT}"
    volumes:
      - ./symfony/:/var/www
    networks:
      - symfony-network
    command: [ "/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/supervisord.conf" ]
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "supervisorctl status messenger-worker:* | grep RUNNING | wc -l | grep -q 4" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  symfony-network:
    driver: bridge