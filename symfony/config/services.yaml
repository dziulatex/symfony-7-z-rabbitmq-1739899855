# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  uploadsDirectory: '%kernel.project_dir%/public/file/uploads'
  mainUserPassword: '%env(MAIN_USER_PASSWORD)%'
  mainUserEmail: '%env(MAIN_USER_EMAIL)%'
  batchProcessorRowLimit: 100000
services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true
    # Automatically registers your services as commands, event subscribers, etc.
  Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
    arguments:
      - '%env(DATABASE_URL)%'
  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'
  App\Service\:
    resource: '../src/Service/'
    public: true
  App\CommandHandler\:
    resource: '../src/CommandHandler/'
    public: true
  App\Service\Filesystem\LocalFilesystem:
    arguments:
      $uploadsDirectory: '%uploadsDirectory%'
  App\Service\FileProcessing\BatchProcessor:
    arguments:
      $messageBus: '@messenger.bus.default'
      $logger: '@logger'
      $rowLimit: '%batchProcessorRowLimit%'
  App\TestFixtures\FileUploadFixture:
    arguments:
      $batchProcessorRowLimit: '%batchProcessorRowLimit%'
  Redis:
    class: Redis
    calls:
      - [ connect, [ '%env(REDIS_HOST)%', '%env(int:REDIS_PORT)%' ] ]
      - [ auth, [ '%env(REDIS_PASSWORD)%' ] ]
  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
